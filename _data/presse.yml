# Retombées presse et réseaux sociaux, affichées sur la page /ils-parlent-de-nous.
#
# Pour ajouter une mention, copier un bloc ci-dessous et le remplir :
#   type          : article (presse, blog, site d'info), agenda (fiche d'agenda
#                   en ligne) ou social (post Facebook, Instagram, LinkedIn…)
#   media         : nom du média ou du compte (ex. « actu Rouen », « Vie et Espoir »)
#   reseau        : pour un post (type social) : facebook, instagram, linkedin ou tiktok
#   titre         : titre de l'article ou résumé court du post
#   url           : lien vers l'article ou le post
#   date          : date de publication (AAAA-MM-JJ), sert au tri (plus récent en premier)
#   date_affichee : optionnel, remplace la date affichée (ex. quand le jour exact est inconnu)
#   evenement     : événement concerné (ex. « Rouen Express 2026 »)
#   extrait       : une ou deux phrases qui résument ce que dit le média

